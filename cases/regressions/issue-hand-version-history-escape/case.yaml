feature: design.editor.keyboard
intent: >-
  Escape closes the version history panel, and the layers come back. The engine's own Escape
  comes first (a drawing tool goes back to Move), and the panel's fields, a menu or a dialog over
  it keep theirs. Before, Escape did nothing to the panel: only its close button closed it
  (walkthrough 2026-11-27, new finding 3). web/tests/hand/keys.mjs opens the panel from the
  Actions palette, presses R, Escape, Escape and R with real keys and reads the tool and the panel
  back.
