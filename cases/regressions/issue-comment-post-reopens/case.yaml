format: 1
id: regressions/issue-comment-post-reopens
feature: design.comment.threads
intent: >-
  A posted comment opens its thread only when the person has done nothing since posting: the
  draft composer waited for the engine and the editor's refresh and then always opened the new
  thread, so a press on the canvas made meanwhile (which closes the draft, and with the Comment
  tool starts a new one) was undone, the new draft vanished, the thread popped open, and the next
  Escape closed that thread instead of doing what the person meant. The browser test holds the
  engine's answer to comment.add until the press is done, so the order is the same on every run.
layer: gate
dimension: function
source:
  kind: issue
  from: Kition Design CI on GitHub's Linux runners (web/tests/menus.mjs, WebKit)
  license: owned
input: []
steps:
  - exec:
      cmd: [node, web/tests/menus.mjs, webkit]
expected:
  - { actual: "out:exec", compare: exit, value: 0 }
since: "2026-11-22"
timeout_s: 300
requires: [webkit]
