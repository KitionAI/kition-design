id: regressions/issue-hand-d10-empty-text-undo
feature: design.editor.text-and-view
intent: >-
  A text made with the Text tool and typed into is one undo step with its layer: T, a click,
  Hello, Escape and Cmd+Z left an empty text layer 1 px wide and nothing more to undo
  (walkthrough D10). The editing step now starts before the layer is added, so undoing it takes
  the layer away and redo brings it back with its text; a click with nothing typed still leaves no
  layer and no step.
