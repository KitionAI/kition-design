format: 1
id: regressions/issue-hand-l5-paste-external
feature: design.editor.system-clipboard
intent: >-
  Cmd+V pastes what is on the system clipboard: with SVG text copied in another app it pasted the
  rectangle copied earlier in the editor (walkthrough L5), and nothing the editor copied reached
  the system clipboard (D8, R7). The editor takes the page's paste event: an image another app
  copied becomes an image layer in the middle of the view, SVG text an editable frame there, other
  text a text layer; each is one undo step. A copy of layers puts the editor's own mark on the
  clipboard (then the layers' SVG, or their characters when all are text), and its paste is the
  engine's copy again, in place, or in the middle of the view when the original is out of it.
  While a text is edited, Copy puts the selected characters on the clipboard and Paste types the
  clipboard's text. web/tests/hand/clipboard.mjs sends the paste and copy events the browser sends
  for Cmd+V and Cmd+C, and in Chromium presses the real keys with the clipboard allowed.
