id: regressions/issue-ctrl-shift-question
feature: design.platform.display-modes
intent: >-
  Ctrl+Shift+? opens Keyboard shortcuts off the Mac too: the `?` matcher took the Ctrl key for Cmd
  there and then asked for Cmd not pressed and Ctrl pressed, which no key press is, so on Linux and
  Windows the shortcut did nothing.
