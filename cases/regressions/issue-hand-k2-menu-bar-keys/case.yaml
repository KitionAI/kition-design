id: regressions/issue-hand-k2-menu-bar-keys
feature: design.editor.keyboard
intent: >-
  The top bar's menus write a shortcut as the main menu and the Keyboard shortcuts dialog do:
  symbols on a Mac (⌥⌘G, ⇧⌘Z), Ctrl+Alt+G and Ctrl+Shift+Z on Windows and Linux. They showed the
  kit notation instead, "Cmd+Alt+G" on every platform (walkthrough K2).
  web/tests/hand/keys.mjs opens the top bar's Edit, Object and Arrange menus and compares each
  row's shortcut with the main menu's, on the machine's platform and on a page that reports the
  other one.
