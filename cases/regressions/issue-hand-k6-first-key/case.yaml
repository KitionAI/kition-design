feature: design.editor.keyboard
intent: >-
  The keyboard works as soon as the editor opens, before anything is clicked: the development host
  never gave its frame the focus and the editor never took it, so R, Shift+1 and Cmd+A did nothing
  until a click on the canvas. web/tests/hand/keys.mjs presses R right after the document opens and
  reads the tool back.
