format: 1
id: regressions/issue-hand-m2-damage-repaint
feature: design.editor.gesture-cost
intent: >-
  A drag repaints the area it changed, not the whole view: every drag sample's answer named no
  area, so the canvas drew the whole view and its margin again (four times the view's pixels,
  about 255 ms a frame for the 348-layer sample and 1.3 s for 2784 layers), and a drag showed 1-12
  frames a second (walkthrough M1, M2). The engine now answers each tool event with the area that
  differs between what the canvas showed before and after it; the test drags a rectangle next to an
  ellipse with a shadow and a rotated rectangle at 100 % and at 50 %, patches a frame with each
  answer's area as the canvas does, and checks the patched frame against a whole render after
  every event (within the retained renderer's measure) and that each patch is a small part of the
  frame; a click that only selects names next to nothing, outline mode names nothing.
layer: gate
dimension: function
source:
  kind: issue
  from: Kition Design hand walkthrough 2026-11-26, findings M1, M2 and root cause R2 (kition-plan kit-docs/design/walkthrough)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-design-kit, filter: "a_drag_names_the_area_it_changed_and_the_patched_frame_is_a_whole_render" }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
