format: 1
id: regressions/issue-hand-d8-text-clipboard
feature: design.editor.text-and-view
intent: >-
  Copy, cut and paste while editing a text act on its characters as plain text: a word selected,
  Cmd+C, End and Cmd+V left the text as it was and pasted a second text layer over it
  (walkthrough D8). edit.copy and edit.cut take the selected characters (nothing when none are
  selected), edit.paste types the copied text at the caret, and no layer is added or removed.
  web/tests/hand/text.mjs does it with real keys and counts the layers; the engine's
  text_edit_hand_tests check the commands. The system clipboard is not read or written here.
