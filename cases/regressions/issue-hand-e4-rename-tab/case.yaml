format: 1
id: regressions/issue-hand-e4-rename-tab
feature: design.editor.canvas-picking
intent: >-
  Renaming a layer in the Layers panel, Tab keeps the name and goes on renaming the next row, and
  Shift+Tab the row before. In Safari's engine the rename ended at once: the row just renamed took
  the keyboard back a frame after the next row's field had it, and the letters typed next went to
  the canvas as tool keys (walkthrough E4). web/tests/hand/keys.mjs renames two rows with real
  keys and reads the names back.
layer: gate
