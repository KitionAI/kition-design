format: 1
id: regressions/issue-hand-b11-hold-z
feature: design.editor.canvas-input
intent: >-
  Holding Z on the canvas did nothing (walkthrough B11, gap R1): the shortcuts dialog lists Hold
  Z for the zoom tool, but no part of the editor listened for it, and a click with Z held selected
  the layer under the pointer. With Z held a click now zooms in one step about the pointer,
  Alt+click zooms out one step and a drag zooms to the area dragged, selecting and drawing
  nothing, with a zoom cursor; letting go of Z gives the canvas back to the Move tool.
  web/tests/hand/view.mjs does it with a real keyboard and mouse (its B11 part) and reads the view
  and the selection back.
