format: 1
id: regressions/issue-hand-m2-zoomed-out-render
feature: design.editor.gesture-cost
intent: >-
  A zoomed-out canvas frame costs its own pixels: below 100 % the engine drew the area at 1:1 and
  then reduced it, so a frame at 50 % drew four times its pixels (9.7 million for one view of the
  sample) and at 25 % sixteen times (walkthrough M1, M2; measurements stage 3). The canvas's
  whole-number reductions are now drawn straight at their scale: render_area at 1/2, 1/3 and 1/4
  must equal the renderer's own drawing of that area at that scale (with the canvas's level of
  detail), pixel for pixel, not the average of a 1:1 drawing.
layer: gate
dimension: function
source:
  kind: issue
  from: Kition Design hand walkthrough 2026-11-26, measurements stage 3 (probe14z; kition-plan kit-docs/design/walkthrough)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-design-kit, filter: "a_zoomed_out_area_is_drawn_straight_at_its_scale" }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-26"
