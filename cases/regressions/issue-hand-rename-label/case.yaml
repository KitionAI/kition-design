intent: >-
  A double-click on a frame's name label on the canvas renames it there: the engine asked for the
  field (`canvas.renameLabel`) and nothing in the editor listened, so the double-click did nothing.
  web/tests/hand/keys.mjs double-clicks a top-level frame's label, types a name and presses Enter
