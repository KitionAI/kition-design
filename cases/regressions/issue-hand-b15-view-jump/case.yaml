intent: >-
  The first frame drawn on a new page stays where it was drawn: the page's document area grew
  from 0, 0, 1920 x 1080 to -1000, -1000, 2000 x 2000 round it, the view kept its numbers, and the
  frame jumped about 750 px down and right, so the next click with the Text tool missed it
  (walkthrough B15). web/tests/hand/view.mjs adds a page, draws a frame with F and a real drag,
  checks that the frame is still under the place it was drawn from, and clicks inside it with the
  Text tool, which must make a text inside the frame; the editor moves the view by as much as the
  area's origin moved.
