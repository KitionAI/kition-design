format: 1
id: design.file.content-only/no-history
feature: design.file.content-only
intent: >-
  A saved design holds its content (kdm/content.json) and nothing of its history: typed-then-deleted text, a deleted layer and an overwritten name are in the session's changes and in no file; an unchanged design saves to the same bytes and, opened again, is the same objects under the same ids; a file opened without a store is the same document and takes edits; undo after a save takes back the last edit; and a file opens on the host's stored replica, whose line of changes continues.
