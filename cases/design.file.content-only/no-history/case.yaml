id: design.file.content-only/no-history
feature: design.file.content-only
intent: >-
  A saved design holds its content and, of its history, only the seal: typed-then-deleted text, a deleted layer and an overwritten name are in the session's history and in no file; an unchanged design saves to the same bytes; a file opened without a store is the same document and takes edits; a file replica and the whole history converge; undo after a save takes back the last edit; a save nobody sealed for seals a copy; and a file opens on the host's stored replica, which keeps its history.
