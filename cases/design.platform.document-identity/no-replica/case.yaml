feature: design.platform.document-identity
intent: >-
  Through the real kition-design process: an empty .kdesign, a .kdesign written without the
  replica bridge and a bare document.json carry no identity, and each forks into the same bytes
  with no docId; a file whose replica entries do not load (a damaged snapshot, a meta.json that is
  not a design replica's, a listed snapshot missing) is refused as unsupported_format by both
  document.identity and document.fork, never answered with no identity, and the fork writes
  nothing.
