[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]

[workspace.package]
version = "0.11.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-design"

[workspace.dependencies]
# internal
kition-design-geom = { path = "crates/support/geom" }
kition-design-color = { path = "crates/support/color" }
kition-design-doc = { path = "crates/engine/doc" }
kition-design-layout = { path = "crates/engine/layout" }
kition-design-text = { path = "crates/support/text" }
kition-design-pathops = { path = "crates/support/pathops" }
kition-design-render = { path = "crates/render/render" }
kition-design-svg = { path = "crates/formats/svg" }
kition-design-pdf = { path = "crates/formats/pdf" }
kition-design-vectordrawable = { path = "crates/formats/vectordrawable" }
kition-design-format = { path = "crates/formats/format" }
kition-design-collab = { path = "crates/engine/collab" }
kition-design-engine = { path = "crates/engine/engine" }
kition-design-plugin = { path = "crates/engine/plugin" }
# The `kit.design` KDM bridge (Kition's own).
kition-design-kdm = { path = "crates/kdm/kdm-model" }

kition-design-docpath = { path = "crates/support/docpath" }
kition-design-kit = { path = "bindings/wasm" }

# kition-sdk, pinned by commit (one revision for every crate of it)
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }
# The collaboration budgets (kition-convergence performance mode), for the SDK crate's tests.
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "ba2264b2e7e309db35f7cb58e7c77c12eb24a5e5" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1.13"
log = "0.4"
same-file = "1.0.6"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }

# rendering / formats
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# Already built for `image`: embedded ICC profiles (moxcms) and PNG colour chunks (png).
moxcms = "0.8"
png = "0.18"
usvg = "0.48"
krilla = "0.8"
skrifa = "0.47"
harfrust = "0.13"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
# Code export: layer names transliterated into ASCII identifiers (pure Rust data tables, zero
# dependencies, BSD-3-Clause, no_std so the web build keeps it too).
deunicode = "1.6"
linesweeper = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# `.fig` import: raw deflate chunks (already built for zip) and zstd chunks (pure Rust, MIT, wasm-safe).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
sha1 = "0.11"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1"

# plugins: a pure-Rust, metered WebAssembly interpreter (no JIT; also runs in the web build). The
# portable dispatch loop: tail-call dispatch relies on an LLVM optimisation that unoptimised and
# debug builds may not do, and then a long-running plugin overflows the native stack.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
wat = "1.261"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# Kition Design never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (.clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep file:line in panic backtraces; dependencies carry no debug info. Both make
# the test build faster and the target dir smaller.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
