  - id: design.agent.ids
    title: Stable tool ids and typed command references for layers and resources
    dimension: [ai, conversion]
    priority: P0
    status: partial
    gap: "An independent reading covers all 372 write handlers; 368 commands are mechanically compared across 803 paths (four widget commands need an unavailable plugin). The gate permits zero held-less commands and twelve held-more commands: import name membership, page-window occupants, prototype mode-reference replay, painted-bound facts in five spatial commands and unconditional reflow inputs in three no-op text commands and unread current subtrees in Dev Mode resolution. Batch selection/dataflow, layout limits, text and group membership, variable defaults/aliases and consumed appearance are covered by independent-writer tests. The 300-cell constraint matrix has zero wrong writes and false refusals; other combinations remain unproven. The pinned SDK still accepts implicit-selection wrong writes, refuses unrelated address/membership changes, and cannot observe a linked library file changing by itself."
    paths: [crates/kdm/kdm-model/model/schema.json, crates/kdm/kdm-model/src/validate.rs, bindings/wasm/src/lib.rs, bindings/wasm/src/rests/**, bindings/wasm/tests/declarations_independent.rs, bindings/headless/tests/premise.rs, bindings/headless/tests/outside/**]
